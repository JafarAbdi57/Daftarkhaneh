name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name Daftarkhaneh app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Daftarkhaneh-Windows
          path: dist/Daftarkhaneh.exe
